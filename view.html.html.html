body.lock{overflow:hidden}
#app{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(96px + var(--sb)) max(16px,env(safe-area-inset-left,0px))}
.top{padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center}
.brand b{font-size:1.05rem;letter-spacing:1px}.brand small{display:block;font-size:.66rem;color:var(--mut);letter-spacing:.5px}
.pill{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:4px 12px;font-size:.78rem;color:var(--mut)}
h1{font-size:2rem;margin:10px 0 2px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.hero{background:linear-gradient(145deg,var(--o2),var(--o));border-radius:28px;padding:20px;color:#3b1d00;box-shadow:0 14px 30px rgba(255,154,60,.35);margin-bottom:14px}
.hero .big{font-size:2.6rem;font-weight:800;line-height:1.1}.hero span{opacity:.8;font-size:.9rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 16px rgba(60,30,0,.06)}
.card b.n{display:block;font-size:1.6rem;font-weight:800}.card small{color:var(--mut)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px;font-weight:800;font-size:1.05rem}
.sec a,.sec button{color:var(--od);font-size:.85rem;font-weight:600}
.list{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 4px 16px rgba(60,30,0,.06)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:right;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row:active{background:#fff7ee}
.av{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;background:hsl(var(--h),65%,55%)}
.mid{flex:1;min-width:0}.mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mid small{display:block;color:var(--mut);font-size:.78rem}.mid small.dt{white-space:normal;font-size:.72rem;line-height:1.4;margin-top:2px;color:#a3563a}
.nums{display:flex;flex-direction:column;gap:3px;align-items:flex-end}.nums small{color:var(--mut);font-size:.72rem;max-width:46vw;text-align:left;line-height:1.3}
.c{background:#f2f2f4;color:#3a3a40;border-radius:20px;padding:0 10px;font-size:.78rem;font-weight:700}
.c.r{background:#ffe3e6;color:#c4163a}
.bar{height:6px;border-radius:3px;background:#f3e9dc;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--o);border-radius:3px}
.srch{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.srch input{width:100%;border:0;background:#fff;border-radius:16px;padding:13px 16px;box-shadow:0 2px 10px rgba(60,30,0,.07)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border-radius:20px;padding:6px 14px;font-size:.85rem;border:1px solid var(--ln)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;color:var(--mut);padding:26px}
.tabs{position:fixed;right:0;left:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 14px calc(8px + var(--sb));background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--ln)}
.tabs>div{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--mut);position:relative;padding:4px 0}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--od);font-weight:700}
.tab b{position:absolute;top:-2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:#f43f5e;color:#fff;font-size:.68rem;line-height:18px;padding:0 4px;text-align:center}
.fab{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(84px + var(--sb));z-index:15;width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,var(--o2),var(--o));color:#fff;font-size:2rem;line-height:1;box-shadow:0 10px 22px rgba(255,154,60,.5)}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,10,0,.4);z-index:40}
.sh{overscroll-behavior:contain;position:fixed;right:0;left:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(18px + var(--sb));max-height:90%;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:#dccbb8;margin:2px auto 10px}
.sh h3{margin:0 0 10px}.sh h4{margin:14px 0 6px;color:var(--mut);font-size:.85rem}
.fl{display:block;margin-bottom:10px;font-size:.82rem;color:var(--mut)}
.fl input,.fl select,.sh textarea,.set input,.set select,.set textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--ln);background:#fff;border-radius:14px;padding:11px 12px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gr .fl{margin:0}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border-radius:16px;padding:13px;font-weight:700;background:#fff;border:1px solid var(--ln)}
.btn.pri{background:linear-gradient(145deg,var(--o2),var(--o));color:#3b1d00;border:0}.btn.dng{color:#c4163a}
.set .card{margin-bottom:12px}.set h4{margin:0 0 8px}.set p{margin:6px 0;color:var(--mut);font-size:.85rem}
.set textarea{min-height:90px;font-size:13px;direction:ltr}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--sb));background:#1c1410;color:#fff;padding:9px 18px;border-radius:20px;font-size:.88rem;z-index:60}
#lk{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px calc(24px + env(safe-area-inset-right,0px)) calc(24px + var(--sb)) calc(24px + env(safe-area-inset-left,0px));text-align:center;direction:rtl}
#lk b.lg{font-size:1.4rem;font-weight:800;letter-spacing:1px}
#lk p{margin:0;color:var(--mut);font-size:.95rem;min-height:1.4em}
#lk p.er{color:#c4163a;font-weight:700}
.dots{display:flex;gap:16px;direction:ltr}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--od);transition:background .12s}
.dots i.f{background:var(--od)}
.dots.sh2{animation:shk .3s}
@keyframes shk{20%{transform:translateX(-10px)}60%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr;margin-top:6px}
.pad button{height:76px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(60,30,0,.08);font-size:1.7rem;font-weight:600}
.pad button:active{background:#ffe9d2}
.pad .x{background:none;box-shadow:none;font-size:1.1rem;color:var(--mut)}
.brand img.blg{height:46px;width:auto;display:block}#lk img.lgo{width:min(250px,68vw);height:auto}</style></head><body>
